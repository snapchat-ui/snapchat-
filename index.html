<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat - Log In</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        snapYellow: '#FFFC00',
                        snapDark: '#121212',
                        snapGray: '#F7F7F7',
                        snapTextGray: '#65676B',
                        snapInputBg: '#F5F5F5',
                        snapBorder: '#E5E7EB',
                        snapBlue: '#0084FF',
                        snapHoverBlue: '#0073E6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFFC00;
        }
        /* Custom subtle shadow for Snapchat look */
        .snap-card-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="min-h-screen font-sans text-gray-900 flex flex-col justify-between items-center p-4 sm:p-6 select-none">

    <!-- Top Navigation Bar / Branding Header -->
    <header class="w-full max-w-6xl flex justify-between items-center py-2 px-4">
        <div class="flex items-center space-x-2">
            <!-- Snapchat Icon Logo Header -->
            <div class="w-10 h-10 bg-black rounded-full flex items-center justify-center cursor-pointer hover:opacity-90 transition">
                <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24">
                    <path d="M12 2C8.5 2 6 4.3 6 7.5c0 1.2.3 2.1.8 2.8.2.3.4.6.4.9 0 .4-.3.7-.6.9-1 .6-2.1.9-2.1 1.9 0 .6.4 1.1 1.2 1.4.6.2 1.3.4 1.7.9.4.5.2 1.2-.2 1.8-.4.6-.9 1.4-.9 2.3 0 1.5 1.5 2.6 4.7 2.6 1 0 1.8-.1 2.3-.3.2-.1.4-.1.6 0 .5.2 1.3.3 2.3.3 3.2 0 4.7-1.1 4.7-2.6 0-.9-.5-1.7-.9-2.3-.4-.6-.6-1.3-.2-1.8.4-.5 1.1-.7 1.7-.9.8-.3 1.2-.8 1.2-1.4 0-1-1.1-1.3-2.1-1.9-.3-.2-.6-.5-.6-.9 0-.3.2-.6.4-.9.5-.7.8-1.6.8-2.8C18 4.3 15.5 2 12 2z"/>
                </svg>
            </div>
            <span class="font-bold text-lg tracking-tight hidden sm:inline">Snapchat</span>
        </div>

        <div class="flex items-center space-x-3">
            <span class="text-sm font-semibold hidden md:inline">Don't have an account?</span>
            <a href="#" class="bg-black text-white hover:bg-gray-800 text-xs sm:text-sm font-bold py-2 px-5 rounded-full transition-all duration-200">
                Sign Up
            </a>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md my-auto py-6">
        <!-- White Login Card -->
        <div class="bg-white rounded-3xl p-6 sm:p-10 snap-card-shadow flex flex-col items-center">

            <!-- Snapchat Ghost Logo Header inside Card -->
            <div class="mb-6 flex flex-col items-center">
                <div class="w-16 h-16 bg-snapYellow rounded-2xl flex items-center justify-center mb-3 shadow-inner">
                    <!-- SVG Ghost Icon -->
                    <svg class="w-10 h-10 fill-black" viewBox="0 0 24 24">
                        <path d="M12.002 2c-3.567 0-6.002 2.355-6.002 5.568 0 1.242.342 2.193.847 2.935.25.367.435.688.435 1.01 0 .425-.333.784-.666 1.012-1.043.712-2.116 1.034-2.116 2.068 0 .66.49 1.196 1.3 1.5.642.24 1.348.423 1.77.962.422.54.212 1.312-.224 1.954-.436.643-.98 1.49-.98 2.49 0 1.62 1.634 2.801 4.978 2.801 1.05 0 1.882-.12 2.454-.316.216-.074.45-.074.666 0 .572.196 1.404.316 2.454.316 3.344 0 4.978-1.18 4.978-2.8 0-.999-.544-1.847-.98-2.49-.436-.642-.646-1.414-.224-1.954.422-.539 1.128-.722 1.77-.962.81-.304 1.3-.84 1.3-1.5 0-1.034-1.073-1.356-2.116-2.068-.333-.228-.666-.587-.666-1.012 0-.322.185-.643.435-1.01.505-.742.847-1.693.847-2.935C18.004 4.355 15.569 2 12.002 2z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">Log In to Snapchat</h1>
            </div>

            <!-- Toast / Message Box (Notification hidden by default) -->
            <div id="toastMessage" class="hidden w-full mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs font-semibold rounded-xl flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation text-sm"></i>
                <span id="toastText">Invalid username or password.</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="w-full flex flex-col space-y-4" onsubmit="handleLogin(event)">
                
                <!-- Input: Username or Email -->
                <div class="flex flex-col space-y-1">
                    <label for="identifier" class="text-xs font-bold text-gray-600 uppercase tracking-wider pl-1">
                        Username or Email
                    </label>
                    <div class="relative flex items-center">
                        <input 
                            type="text" 
                            id="identifier" 
                            name="identifier" 
                            required 
                            placeholder="Enter username or email"
                            class="w-full bg-snapInputBg text-gray-900 text-sm font-medium rounded-2xl px-4 py-3.5 outline-none border border-transparent focus:border-black focus:bg-white transition duration-200"
                        >
                    </div>
                </div>

                <!-- Input: Password -->
                <div class="flex flex-col space-y-1">
                    <div class="flex justify-between items-center pl-1 pr-1">
                        <label for="password" class="text-xs font-bold text-gray-600 uppercase tracking-wider">
                            Password
                        </label>
                    </div>
                    <div class="relative flex items-center">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            placeholder="Enter password"
                            class="w-full bg-snapInputBg text-gray-900 text-sm font-medium rounded-2xl px-4 py-3.5 pr-12 outline-none border border-transparent focus:border-black focus:bg-white transition duration-200"
                        >
                        <!-- Show/Hide Password Button -->
                        <button 
                            type="button" 
                            onclick="togglePasswordVisibility()" 
                            class="absolute right-4 text-gray-400 hover:text-gray-600 focus:outline-none transition"
                            title="Toggle Password Visibility"
                        >
                            <i id="toggleEye" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Forgot Password Link -->
                <div class="flex justify-end pt-0.5">
                    <a href="#" onclick="showToast('Password reset link sent to your email/phone.', false)" class="text-xs font-semibold text-snapBlue hover:underline">
                        Forgot Password?
                    </a>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="flex items-center space-x-2 pt-1 pl-1">
                    <input 
                        type="checkbox" 
                        id="rememberMe" 
                        class="w-4 h-4 rounded border-gray-300 text-black focus:ring-black accent-black cursor-pointer"
                    >
                    <label for="rememberMe" class="text-xs font-medium text-gray-600 cursor-pointer select-none">
                        Save log in info on this browser
                    </label>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full bg-snapBlue hover:bg-snapHoverBlue text-white font-bold py-3.5 rounded-full shadow-md hover:shadow-lg transition duration-200 mt-2 flex items-center justify-center space-x-2"
                >
                    <span id="btnText">Log In</span>
                    <i id="btnSpinner" class="fa-solid fa-spinner fa-spin hidden"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="w-full flex items-center my-6">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">OR</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Alternative Options -->
            <div class="w-full flex flex-col space-y-3">
                <button 
                    onclick="showToast('Use App Code feature clicked', false)" 
                    class="w-full bg-snapInputBg hover:bg-gray-200 text-gray-800 text-sm font-bold py-3 rounded-full transition duration-200 flex items-center justify-center space-x-2"
                >
                    <i class="fa-solid fa-qrcode text-base"></i>
                    <span>Log In with Login Code</span>
                </button>
            </div>

        </div>

        <!-- Footer Callout Card inside Main section for Mobile/Responsive UX -->
        <div class="mt-6 text-center">
            <p class="text-sm font-semibold text-gray-800">
                New to Snapchat? 
                <a href="#" class="text-black underline font-bold hover:opacity-80">Sign up for an account</a>
            </p>
        </div>
    </main>

    <!-- Footer Links -->
    <footer class="w-full max-w-5xl py-4 text-center text-xs text-gray-800 font-medium flex flex-wrap justify-center gap-x-6 gap-y-2">
        <a href="#" class="hover:underline">Privacy Policy</a>
        <a href="#" class="hover:underline">Terms of Service</a>
        <a href="#" class="hover:underline">Cookie Preferences</a>
        <a href="#" class="hover:underline">Community Guidelines</a>
        <a href="#" class="hover:underline">Safety Center</a>
        <span class="text-gray-600">© 2026 Snap Inc.</span>
    </footer>

    <!-- Interactive Logic Script -->
    <script>
        // Toggle password visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleEye = document.getElementById('toggleEye');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleEye.classList.remove('fa-eye');
                toggleEye.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleEye.classList.remove('fa-eye-slash');
                toggleEye.classList.add('fa-eye');
            }
        }

        // Custom Toast Message Handler
        function showToast(message, isError = true) {
            const toast = document.getElementById('toastMessage');
            const toastText = document.getElementById('toastText');
            
            toastText.textContent = message;
            
            if (isError) {
                toast.className = "w-full mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs font-semibold rounded-xl flex items-center space-x-2 animate-bounce";
            } else {
                toast.className = "w-full mb-4 p-3 bg-green-50 border border-green-200 text-green-700 text-xs font-semibold rounded-xl flex items-center space-x-2";
            }
            
            toast.classList.remove('hidden');

            setTimeout(() => {
                toast.classList.remove('animate-bounce');
            }, 1000);
        }

        // Form Submission Simulation
        function handleLogin(event) {
            event.preventDefault();
            
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value.trim();
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const submitBtn = document.getElementById('submitBtn');

            if (!identifier || !password) {
                showToast('Please enter both username and password.');
                return;
            }

            // Show loading state
            btnText.textContent = 'Logging in...';
            btnSpinner.classList.remove('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            // Simulate Network Request Delay
            setTimeout(() => {
                btnText.textContent = 'Log In';
                btnSpinner.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');

                // Demo validation logic
                if (password.length < 6) {
                    showToast('Password must be at least 6 characters long.', true);
                } else {
                    showToast('Log in successful! Redirecting...', false);
                }
            }, 1500);
        }
    </script>
</body>
</html>
